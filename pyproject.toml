[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x5-gripper-sdk"
version = "0.1.0"
description = "Standalone direct-SocketCAN SDK for the X5-2023 external gripper"
readme = "README.zh-CN.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
    "gin-config>=0.5.0",
    "mujoco>=2.3.7",
    "numpy>=1.24",
]

[project.scripts]
x5-gripper = "x5_gripper_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
x5_gripper_sdk = [
    "models/arx_x5_2023/*.xml",
    "vendor_runtime/arx_x5_python/bimanual/script/*.urdf",
    "vendor_runtime/arx_x5_python/bimanual/api/*.so",
    "vendor_runtime/arx_x5_python/bimanual/api/arx_x5_python/*.so",
    "vendor_runtime/arx_x5_python/bimanual/api/arx_x5_src/*.so",
]
